name: Monitor La Odisea IMAX

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Correr el monitor
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x monitor.sh
          ./monitor.sh

      - name: Guardar el estado
        if: always()
        run: |
          mkdir -p state
          date -u +%F > state/last_run.txt
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add -f state/
          git diff --staged --quiet && exit 0
          git commit -m "estado $(date -u +'%F %H:%M') UTC"
          git pull --rebase --autostash || true
          git push
